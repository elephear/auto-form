<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>星辰招聘 · 注册账号</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="hero">
    <h1>星辰招聘 · 注册账号</h1>
    <p>第一步：创建账号（站点 A 使用 layui 风格表单）</p>
    <div class="nav">
      <a href="index.html">首页</a>
      <a href="register.html">注册</a>
      <a href="apply.html">网申</a>
      <a href="login.html">登录</a>
    </div>
  </div>

  <div class="wrap">
    <div class="card">
      <h2>注册新账号</h2>
      <div class="hint-box">按 <b>Ctrl + /</b>，导入简历文件后点击「开始智能填写」，扩展会生成账号、邮箱与符合规则的密码。</div>

      <form id="regForm" class="layui-form" autocomplete="off">
        <div class="layui-form-item">
          <label class="layui-form-label">用户名</label>
          <div class="layui-input-block">
            <input type="text" name="username" placeholder="6-20 位字母、数字或下划线" required />
          </div>
        </div>
        <div class="layui-form-item">
          <label class="layui-form-label">邮箱</label>
          <div class="layui-input-block">
            <input type="email" name="email" placeholder="用于找回密码" required />
          </div>
        </div>
        <div class="layui-form-item">
          <label class="layui-form-label">密码</label>
          <div class="layui-input-block">
            <input type="password" name="password" minlength="8" maxlength="16" required />
            <p class="d-rightTips">密码需 8-16 位，包含大写字母、小写字母和数字</p>
          </div>
        </div>
        <div class="layui-form-item">
          <label class="layui-form-label">确认密码</label>
          <div class="layui-input-block">
            <input type="password" name="confirm" required />
          </div>
        </div>
        <div class="layui-form-item">
          <div class="layui-input-block actions">
            <button type="button" class="btn" id="btnRegister">注册</button>
            <a class="btn ghost" href="login.html" style="text-decoration:none;display:inline-block;">已有账号，去登录</a>
          </div>
        </div>
      </form>

      <div class="msg" id="msg"></div>
    </div>
  </div>

  <script>
  (function () {
    var form = document.getElementById("regForm");
    var msg = document.getElementById("msg");
    function q(name) { return form.querySelector('[name="' + name + '"]'); }
    function setMsg(text, kind) {
      msg.textContent = text;
      msg.className = "msg " + (kind || "");
    }

    document.getElementById("btnRegister").addEventListener("click", function () {
      var u = (q("username").value || "").trim();
      var e = (q("email").value || "").trim();
      var p = q("password").value || "";
      var c = q("confirm").value || "";

      if (!/^[A-Za-z0-9_]{6,20}$/.test(u)) return setMsg("用户名需为 6-20 位字母、数字或下划线", "err");
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)) return setMsg("邮箱格式不正确", "err");
      if (p.length < 8 || p.length > 16) return setMsg("密码长度需为 8-16 位", "err");
      if (!/[a-z]/.test(p) || !/[A-Z]/.test(p) || !/[0-9]/.test(p)) return setMsg("密码需包含大写、小写字母和数字", "err");
      if (p !== c) return setMsg("两次输入的密码不一致", "err");

      var users = [];
      try { users = JSON.parse(localStorage.getItem("siteA_users") || "[]"); } catch (err) { users = []; }
      users = users.filter(function (x) { return x.username !== u; });
      users.push({ username: u, email: e, password: p, createdAt: Date.now() });
      localStorage.setItem("siteA_users", JSON.stringify(users));
      localStorage.setItem("siteA_current", JSON.stringify({ username: u, email: e }));

      setMsg("注册成功！即将进入网申页面…", "ok");
      setTimeout(function () {
        try { location.assign("apply.html"); } catch (err) { /* jsdom 环境忽略 */ }
      }, 300);
    });
  })();
  </script>
</body>
</html>
