<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>蓝海人才 · 注册</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="top">
    <h1>蓝海人才 · 注册账号</h1>
    <p>第一步：邮箱验证 + 密码规则校验（pattern 正则）</p>
    <div class="nav">
      <a href="index.html">首页</a>
      <a href="register.html">注册</a>
      <a href="apply.html">网申</a>
    </div>
  </div>

  <div class="wrap">
    <div class="panel">
      <h2>创建账号</h2>
      <div class="notice">按 <b>Ctrl + /</b> 导入简历后点击「开始智能填写」；扩展会生成符合 pattern 的密码，并填写验证码与勾选协议。</div>

      <form id="regForm" autocomplete="off">
        <table class="table-form">
          <tr>
            <th>邮箱</th>
            <td><input type="email" name="email" placeholder="name@example.com" required /></td>
          </tr>
          <tr>
            <th>验证码</th>
            <td>
              <input type="text" name="code" placeholder="请输入 6 位验证码" maxlength="6" />
              <span class="tip">测试验证码为 123456</span>
            </td>
          </tr>
          <tr>
            <th>设置密码</th>
            <td>
              <input type="password" name="password" minlength="8" maxlength="20"
                     pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,20}$"
                     placeholder="8-20 位，含大写、小写字母和数字" />
              <span class="tip">8-20 位，必须包含大写、小写字母和数字</span>
            </td>
          </tr>
          <tr>
            <th>确认密码</th>
            <td><input type="password" name="confirm" required /></td>
          </tr>
          <tr>
            <th>用户协议</th>
            <td>
              <input type="checkbox" id="agree" name="agree" title="我已阅读并同意用户协议" />
              <label for="agree">我已阅读并同意用户协议</label>
            </td>
          </tr>
        </table>

        <div class="actions" style="margin-top:16px;">
          <button type="button" class="btn" id="btnRegister">注册</button>
          <a class="btn ghost" href="apply.html" style="text-decoration:none;display:inline-block;">直接去网申</a>
        </div>
      </form>

      <div class="msg" id="msg"></div>
    </div>
  </div>

  <script>
  (function () {
    var form = document.getElementById("regForm");
    var msg = document.getElementById("msg");
    function q(name) { return form.querySelector('[name="' + name + '"]'); }
    function setMsg(text, kind) {
      msg.textContent = text;
      msg.className = "msg " + (kind || "");
    }

    document.getElementById("btnRegister").addEventListener("click", function () {
      var email = (q("email").value || "").trim();
      var code = (q("code").value || "").trim();
      var p = q("password").value || "";
      var c = q("confirm").value || "";
      var agree = q("agree").checked;

      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return setMsg("邮箱格式不正确", "err");
      if (code !== "123456") return setMsg("验证码不正确（测试验证码为 123456）", "err");
      if (!/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,20}$/.test(p)) return setMsg("密码需为 8-20 位且包含大小写字母和数字", "err");
      if (p !== c) return setMsg("两次输入的密码不一致", "err");
      if (!agree) return setMsg("请先勾选同意用户协议", "err");

      var users = [];
      try { users = JSON.parse(localStorage.getItem("siteB_users") || "[]"); } catch (e) { users = []; }
      users = users.filter(function (x) { return x.email !== email; });
      users.push({ email: email, password: p, createdAt: Date.now() });
      localStorage.setItem("siteB_users", JSON.stringify(users));
      localStorage.setItem("siteB_current", JSON.stringify({ email: email }));

      setMsg("注册成功！即将进入网申页面…", "ok");
      setTimeout(function () {
        try { location.assign("apply.html"); } catch (e) { /* jsdom 环境忽略 */ }
      }, 300);
    });
  })();
  </script>
</body>
</html>
